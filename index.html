<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Botões para Licitações</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233c;
      --muted: #65718a;
      --line: #dde3ef;
      --primary: #3157d5;
      --surface: rgba(255,255,255,.94);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(80,120,246,.12), transparent 28rem),
        radial-gradient(circle at 92% 85%, rgba(52,152,219,.11), transparent 24rem),
        #f5f7fc;
    }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); letter-spacing: -.03em; }
    header p { margin: 7px 0 0; color: var(--muted); }
    .badge { border: 1px solid #cbd5f5; background: #eef2ff; color: #3653a8; border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
    .layout { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 18px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 40px rgba(30,45,80,.07); }
    .controls { padding: 22px; }
    .preview { padding: 22px; min-width: 0; }
    .control + .control { margin-top: 18px; }
    label, legend { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
    input[type="url"], input[type="text"], input[type="number"] {
      width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 9px;
      background: white; color: var(--ink); padding: 0 12px; font: 600 14px "Segoe UI", sans-serif;
    }
    input:focus { outline: 3px solid rgba(49,87,213,.12); border-color: #7288dd; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .color-row { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
    input[type="color"] { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 9px; padding: 5px; background: white; }
    fieldset { border: 0; padding: 0; margin: 18px 0 0; }
    .preset-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .preset { border: 1px solid var(--line); background: white; border-radius: 9px; padding: 9px 8px; cursor: pointer; color: var(--ink); font-weight: 700; }
    .preset:hover { border-color: #9cabe2; background: #f8faff; }
    .canvas {
      min-height: 250px; display: grid; place-items: center; border: 1px dashed #ccd4e5;
      border-radius: 14px; background-color: #fff; background-image: radial-gradient(#dde3ef 1px, transparent 1px);
      background-size: 18px 18px;
    }
    #previewButton {
      display: flex; align-items: center; justify-content: center; box-sizing: border-box;
      text-decoration: none; color: white; overflow: hidden; white-space: nowrap;
      transition: transform .18s, box-shadow .18s, filter .18s;
    }
    #previewButton:hover { transform: translateY(-1px); filter: brightness(1.04); }
    #previewButton img { height: 25px; max-width: 42px; object-fit: contain; margin-right: 6px; }
    .code-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
    .code-head strong { font-size: 13px; }
    #copyButton { border: 0; border-radius: 8px; background: var(--primary); color: white; height: 36px; padding: 0 12px; font-weight: 800; cursor: pointer; }
    textarea { width: 100%; min-height: 112px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: #111827; color: #dbeafe; padding: 12px; font: 12px/1.5 ui-monospace, monospace; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 620px); padding-top: 24px; }
      .layout { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
      .badge { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Gerador de botões</h1>
        <p>Crie um link personalizado para suas licitações.</p>
      </div>
      <span class="badge">HTML pronto para usar</span>
    </header>

    <div class="layout">
      <section class="panel controls" aria-label="Opções do botão">
        <div class="control">
          <label for="url">URL do site</label>
          <input id="url" type="url" value="https://pncp.gov.br/app/editais/23946262000149/2026/45" placeholder="https://exemplo.com.br">
        </div>

        <fieldset>
          <legend>Exemplos rápidos</legend>
          <div class="preset-row">
            <button class="preset" type="button" data-url="https://pncp.gov.br/app/editais/23946262000149/2026/45">PNCP</button>
            <button class="preset" type="button" data-url="https://app2.licitardigital.com.br/pesquisa/119558">Licitar</button>
          </div>
        </fieldset>

        <div class="control">
          <label for="label">Texto</label>
          <input id="label" type="text" value="PNCP" maxlength="30">
        </div>

        <div class="row control">
          <div>
            <label for="width">Largura (px)</label>
            <input id="width" type="number" value="140" min="70" max="400">
          </div>
          <div>
            <label for="height">Altura (px)</label>
            <input id="height" type="number" value="35" min="24" max="120">
          </div>
        </div>

        <div class="row control">
          <div>
            <label for="colorA">Cor inicial</label>
            <div class="color-row"><input id="colorAText" type="text" value="#1d9f44"><input id="colorA" type="color" value="#1d9f44"></div>
          </div>
          <div>
            <label for="colorB">Cor final</label>
            <div class="color-row"><input id="colorBText" type="text" value="#2573a7"><input id="colorB" type="color" value="#2573a7"></div>
          </div>
        </div>
      </section>

      <section class="panel preview" aria-label="Prévia e código">
        <div class="canvas">
          <a id="previewButton" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <div class="code-head">
          <strong>Código HTML</strong>
          <button id="copyButton" type="button">Copiar código</button>
        </div>
        <textarea id="code" readonly aria-label="Código HTML gerado"></textarea>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const elements = ["url", "label", "width", "height", "colorA", "colorB", "colorAText", "colorBText"];

    function normalizeHex(value, fallback) {
      const hex = value.trim();
      return /^#[0-9a-f]{6}$/i.test(hex) ? hex : fallback;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }

    function detectPreset(url) {
      try {
        const host = new URL(url, location.href).hostname;
        if (host.includes("pncp.gov.br")) return "pncp";
        if (host.includes("licitardigital.com.br") || host.includes("licitar.digital")) return "licitar";
        return "generic";
      } catch {
        return "generic";
      }
    }

    function getFaviconUrl(url) {
      try {
        const origin = new URL(url).origin;
        return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(origin)}&sz=64`;
      } catch {
        return "";
      }
    }

    function update() {
      const url = $("url").value.trim();
      const width = Math.max(70, Math.min(400, Number($("width").value) || 140));
      const height = Math.max(24, Math.min(120, Number($("height").value) || 35));
      const colorA = normalizeHex($("colorAText").value, "#3498db");
      const colorB = normalizeHex($("colorBText").value, "#2981bc");
      const preset = detectPreset(url);
      const enteredLabel = $("label").value.trim();
      const label = preset === "pncp" ? ($("label").value.trim() || "PNCP") :
                    preset === "licitar" ? "" :
                    (enteredLabel && enteredLabel !== "PNCP" && enteredLabel !== "Licitar"
                      ? enteredLabel
                      : "Abrir site");
      if (preset === "generic" && (!enteredLabel || enteredLabel === "PNCP" || enteredLabel === "Licitar")) {
        $("label").value = "Abrir site";
      }

      const button = $("previewButton");
      button.href = url || "#";
      button.style.width = width + "px";
      button.style.height = height + "px";
      button.style.borderRadius = "5px";
      button.style.font = `600 ${Math.max(11, Math.min(20, Math.round(height * .43)))}px 'Segoe UI',sans-serif`;
      button.style.boxShadow = "0 3px 6px rgba(0,0,0,0.15)";
      button.style.background = `linear-gradient(145deg,${colorA},${colorB})`;
      button.style.border = "1px solid rgba(255,255,255,0.2)";

      let logo = "";
      if (preset === "pncp") logo = '<img src="https://pncp.gov.br/app/assets/images/logo.svg" alt="PNCP">';
      if (preset === "licitar") logo = '<img src="https://licitar.digital/wp-content/uploads/2023/07/Ativo-60.png" alt="Licitar">';
      if (preset === "generic" && getFaviconUrl(url)) logo = `<img src="${getFaviconUrl(url)}" alt="">`;
      button.innerHTML = logo + (label ? escapeHtml(label) : "");

      const imgHeight = Math.max(18, height - 10);
      const logoCode = preset === "pncp"
        ? '<img src="https://pncp.gov.br/app/assets/images/logo.svg" alt="PNCP" style="height:' + imgHeight + 'px;margin-right:6px">'
        : preset === "licitar"
          ? '<img src="https://licitar.digital/wp-content/uploads/2023/07/Ativo-60.png" alt=" " style="height:' + imgHeight + 'px;margin-right:6px">'
          : getFaviconUrl(url)
            ? '<img src="' + getFaviconUrl(url) + '" alt="" style="height:' + imgHeight + 'px;margin-right:6px">'
            : "";
      const safeUrl = escapeHtml(url || "#");
      const safeLabel = escapeHtml(label);
      const fontSize = Math.max(11, Math.min(20, Math.round(height * .43)));
      $("code").value = `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;justify-content:center;width:${width}px;height:${height}px;border-radius:5px;font:600 ${fontSize}px 'Segoe UI',sans-serif;text-decoration:none;color:white;box-shadow:0 3px 6px rgba(0,0,0,0.15);background:linear-gradient(145deg,${colorA},${colorB});border:1px solid rgba(255,255,255,0.2);transition:all 0.3s;box-sizing:border-box">${logoCode}${safeLabel ? safeLabel : ""}</a>`;
    }

    for (const id of elements) $(id).addEventListener("input", () => {
      if (id === "colorA") $("colorAText").value = $(id).value;
      if (id === "colorB") $("colorBText").value = $(id).value;
      if (id === "colorAText") $("colorA").value = normalizeHex($(id).value, $("colorA").value);
      if (id === "colorBText") $("colorB").value = normalizeHex($(id).value, $("colorB").value);
      update();
    });

    document.querySelectorAll(".preset").forEach((button) => button.addEventListener("click", () => {
      $("url").value = button.dataset.url;
      if (button.textContent === "PNCP") {
        $("label").value = "PNCP";
        $("colorAText").value = "#1d9f44"; $("colorA").value = "#1d9f44";
        $("colorBText").value = "#2573a7"; $("colorB").value = "#2573a7";
      } else {
        $("label").value = "";
        $("colorAText").value = "#3498db"; $("colorA").value = "#3498db";
        $("colorBText").value = "#2981bc"; $("colorB").value = "#2981bc";
      }
      update();
    }));

    $("copyButton").addEventListener("click", async () => {
      await navigator.clipboard.writeText($("code").value);
      $("copyButton").textContent = "Copiado!";
      setTimeout(() => $("copyButton").textContent = "Copiar código", 1400);
    });

    update();
  </script>
</body>
</html>
